[project]
name = "latent-trainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.0",
    "lightning>=2.5.5",
    "matplotlib>=3.10.7",
    "optuna>=4.5.0",
    "optuna-dashboard>=0.19.0",
    "optuna-integration[pytorch-lightning]>=4.5.0",
    "plotly>=6.3.1",
    "plotpy>=2.7.5",
    "sc2-datasets",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
]

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-section-index>=0.3.10",
    "mkdocstrings>=1.0.3",
    "mkdocstrings-python>=2.0.2",
    "ruff>=0.15.0",
    "mkdocs-material>=9.7.1",
    "mkdocs-include-markdown-plugin>=7.2.1",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.4",
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "mypy>=1.19.1",
    "commitizen>=4.13.7",
]


[tool.ruff]
exclude = [".venv"]
line-length = 88

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
sc2-datasets = { git = "https://github.com/scmisa/SC2_Datasets", branch = "misa/issue#57" }
