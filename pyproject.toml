[project]
name = "latent_trainer"
version = "0.1.0"
description = "SC2 Latent Trainer, a tool for training SC2 based on latent model representations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "lightning>=2.4.0",
    "python-dotenv>=1.0.1",
    "sc2-datasets>=1.0.2",
]

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-section-index>=0.3.10",
    "mkdocstrings>=1.0.3",
    "mkdocstrings-python>=2.0.2",
    "ruff>=0.15.0",
    "mkdocs-material>=9.7.1",
    "mkdocs-include-markdown-plugin>=7.2.1",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.4",
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "mypy>=1.19.1",
    "commitizen>=4.13.7",
]


[tool.ruff]
exclude = [".venv"]
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
