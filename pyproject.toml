[project]
name = "latent_trainer"
version = "0.1.0"
description = "SC2 Latent Trainer, a tool for training SC2 based on latent model representations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "lightning>=2.4.0",
    "python-dotenv>=1.0.1",
    "sc2-datasets>=1.0.2",
]

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-section-index>=0.3.9",
    "mkdocstrings>=0.27.0",
    "mkdocstrings-python>=1.12.2",
    "ruff>=0.8.2",
    "mkdocs-material>=9.5.48",
    "mkdocs-include-markdown-plugin>=7.1.2",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.2.0",
    "pytest>=8.3.4",
    "pre-commit>=4.0.1",
    "mypy>=1.13.0",
]


[tool.ruff]
exclude = [".venv"]
line-length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
